name: Build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install SFML (vcpkg, static)
        run: vcpkg install sfml:x64-linux

      - name: CMake configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build build --parallel

      - name: Install (collect exe + assets into one folder)
        run: cmake --install build --prefix out/2DGame

      - name: Zip
        run: cd out && zip -r ../2DGame-linux.zip 2DGame

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DGame-linux
          path: 2DGame-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SFML (vcpkg)
        run: vcpkg install sfml:x64-windows

      - name: CMake configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install (collect exe + DLLs + assets into one folder)
        run: cmake --install build --config Release --prefix out/2DGame

      - name: Zip
        run: Compress-Archive -Path out/2DGame/* -DestinationPath 2DGame-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DGame-windows
          path: 2DGame-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SFML (vcpkg, static)
        run: vcpkg install sfml:arm64-osx

      - name: CMake configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-osx

      - name: Build
        run: cmake --build build --parallel

      - name: Install (collect exe + assets into one folder)
        run: cmake --install build --prefix out/2DGame

      - name: Zip
        run: cd out && zip -r ../2DGame-macos.zip 2DGame

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DGame-macos
          path: 2DGame-macos.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/2DGame-linux/2DGame-linux.zip
            dist/2DGame-windows/2DGame-windows.zip
            dist/2DGame-macos/2DGame-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}