name: Build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsfml-dev zip patchelf

      - name: CMake configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install (collect exe + assets into one folder)
        run: cmake --install build --prefix out/2DGame

      - name: Bundle shared libraries
        run: |
          DIR=out/2DGame
          EXE="$DIR/game"
          [ -f "$EXE" ] || { echo "Missing $EXE"; ls -R "$DIR"; exit 1; }
          mkdir -p "$DIR/lib"
          ldd "$EXE" | awk '/=> \//{print $3}' | while read -r lib; do
            case "$(basename "$lib")" in
              # provided by every desktop Linux system
              ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*) ;;
              libGL.so*|libGLX.so*|libGLdispatch.so*|libEGL.so*|libOpenGL.so*) ;;
              libX*|libxcb*|libdrm*|libudev*|libasound*) ;;
              *) cp -L "$lib" "$DIR/lib/" ;;
            esac
          done
          patchelf --set-rpath '$ORIGIN/lib' "$EXE"
          for f in "$DIR"/lib/*.so*; do patchelf --set-rpath '$ORIGIN' "$f"; done
          ldd "$EXE" | grep sfml
          if ldd "$EXE" | grep -q "not found"; then
            echo "Unresolved libraries:"; ldd "$EXE"; exit 1
          fi

      - name: Zip
        run: |
          cd out
          zip -r ../2DGame-linux.zip 2DGame

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DGame-linux
          path: 2DGame-linux.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pin SFML to 2.x via a vcpkg manifest
        shell: pwsh
        run: |
          $baseline = (git -C C:\vcpkg rev-parse HEAD).Trim()
          @{
              name               = "2dgame"
              version            = "1.0.0"
              "builtin-baseline" = $baseline
              dependencies       = @("sfml")
              overrides          = @(@{ name = "sfml"; version = "2.6.1" })
          } | ConvertTo-Json -Depth 5 | Set-Content -Path vcpkg.json

      - name: CMake configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install (collect exe + DLLs + assets into one folder)
        run: cmake --install build --config Release --prefix out/2DGame

      - name: Bundle vcpkg dependency DLLs
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "build/vcpkg_installed/x64-windows/bin"
          if (-not (Test-Path $bin)) {
            Write-Host "Not found: $bin"
            Get-ChildItem -Recurse -Filter freetype.dll | Select-Object -ExpandProperty FullName
            exit 1
          }
          Copy-Item "$bin/*.dll" out/2DGame/ -Force
          Get-ChildItem out/2DGame | Format-Table Name, Length
          foreach ($n in "freetype", "vorbis", "vorbisenc", "vorbisfile", "OpenAL32") {
            if (-not (Test-Path "out/2DGame/$n.dll")) { throw "$n.dll missing from package" }
          }

      - name: Zip
        run: Compress-Archive -Path out/2DGame/* -DestinationPath 2DGame-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DGame-windows
          path: 2DGame-windows.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sfml@2 dylibbundler

      - name: CMake configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$(brew --prefix sfml@2)

      - name: Build
        run: cmake --build build --parallel

      - name: Install (collect exe + assets into one folder)
        run: cmake --install build --prefix out/2DGame

      - name: Bundle dylibs
        run: |
          DIR=out/2DGame
          EXE="$DIR/game"
          [ -f "$EXE" ] || { echo "Missing $EXE"; ls -R "$DIR"; exit 1; }
          dylibbundler -od -b -cd \
            -x "$EXE" \
            -d "$DIR/libs/" \
            -p @executable_path/libs/ \
            -s "$(brew --prefix sfml@2)/lib"
          codesign --force --sign - "$DIR"/libs/*.dylib
          codesign --force --sign - "$EXE"
          otool -L "$EXE"
          if otool -L "$EXE" "$DIR"/libs/*.dylib | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
            echo "Homebrew paths still referenced"; exit 1
          fi

      - name: Zip
        run: |
          cd out
          zip -r ../2DGame-macos.zip 2DGame

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DGame-macos
          path: 2DGame-macos.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/2DGame-linux/2DGame-linux.zip
            dist/2DGame-windows/2DGame-windows.zip
            dist/2DGame-macos/2DGame-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
